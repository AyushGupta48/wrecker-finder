<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PartsFinder — My Saved Parts</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --black: #0a0a0a;
      --white: #f5f2ee;
      --accent: #e8431a;
      --mid: #888;
      --border: #d0cbc4;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Barlow', sans-serif;
      background: var(--white);
      color: var(--black);
      min-height: 100vh;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 48px;
      border-bottom: 2px solid var(--black);
      background: var(--white);
    }

    .logo {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 28px;
      font-weight: 900;
      text-decoration: none;
      color: var(--black);
    }
    .logo span { color: var(--accent); }

    .header-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .user-email {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: var(--mid);
    }

    .btn-outline {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 600;
      font-size: 13px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      text-decoration: none;
      color: var(--black);
      border: 2px solid var(--black);
      padding: 7px 16px;
      cursor: pointer;
      background: none;
      transition: background 0.15s, color 0.15s;
    }
    .btn-outline:hover { background: var(--black); color: var(--white); }

    /* ── Page ── */
    .page {
      max-width: 1000px;
      margin: 0 auto;
      padding: 60px 48px 80px;
    }

    .page-eyebrow {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 10px;
    }

    .page h1 {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: clamp(38px, 6vw, 58px);
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: -0.5px;
      line-height: 1;
      margin-bottom: 8px;
    }

    .page-sub {
      font-size: 15px;
      color: #666;
      margin-bottom: 40px;
      padding-bottom: 32px;
      border-bottom: 2px solid var(--black);
    }

    /* ── Loading / empty ── */
    .state-box {
      text-align: center;
      padding: 80px 20px;
      border: 2px dashed var(--border);
      border-radius: 2px;
    }

    .state-box .icon { font-size: 44px; margin-bottom: 14px; }

    .state-box p {
      font-size: 16px;
      color: var(--mid);
      margin-bottom: 20px;
    }

    .spinner {
      width: 34px;
      height: 34px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Cards grid ── */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }

    .listing-card {
      background: #fff;
      border: 1.5px solid var(--border);
      border-radius: 3px;
      padding: 22px 22px 18px;
      position: relative;
      transition: border-color 0.15s, transform 0.15s;
    }

    .listing-card:hover {
      border-color: var(--black);
      transform: translateY(-2px);
    }

    .card-part {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 22px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: -0.3px;
      margin-bottom: 4px;
    }

    .card-car {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 15px;
      font-weight: 600;
      color: var(--mid);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 16px;
    }

    .card-details {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 18px;
    }

    .card-detail {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: #555;
    }

    .card-detail span:first-child {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--mid);
      min-width: 60px;
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 14px;
      border-top: 1px solid var(--border);
    }

    .contact-link {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.5px;
      color: var(--accent);
      text-decoration: none;
      border: 1.5px solid var(--accent);
      padding: 6px 14px;
      border-radius: 2px;
      transition: background 0.15s, color 0.15s;
    }

    .contact-link:hover { background: var(--accent); color: var(--white); }

    .unsave-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 18px;
      opacity: 0.4;
      transition: opacity 0.15s, transform 0.15s;
      padding: 4px;
    }
    .unsave-btn:hover { opacity: 1; transform: scale(1.2); }

    .search-btn-link {
      display: inline-block;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      background: var(--accent);
      color: var(--white);
      text-decoration: none;
      padding: 12px 28px;
      border-radius: 2px;
    }

    footer {
      text-align: center;
      padding: 32px;
      border-top: 2px solid var(--black);
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 13px;
      color: var(--mid);
    }

    @media (max-width: 600px) {
      header { padding: 14px 20px; }
      .page { padding: 40px 20px 60px; }
    }
  </style>
</head>
<body>

  <header>
    <a class="logo" href="home.html">Parts<span>Finder</span></a>
    <div class="header-right">
      <span class="user-email" id="userEmail"></span>
      <a class="btn-outline" href="index.html">Search Parts</a>
      <button class="btn-outline" onclick="logout()">Log Out</button>
    </div>
  </header>

  <main>
    <div class="page">
      <p class="page-eyebrow">My Account</p>
      <h1>Saved Parts</h1>
      <p class="page-sub">Parts you've bookmarked while searching.</p>

      <!-- Loading -->
      <div class="state-box" id="loadingState">
        <div class="spinner"></div>
        <p>Loading your saved parts...</p>
      </div>

      <!-- Empty -->
      <div class="state-box" id="emptyState" style="display:none">
        <div class="icon">🔖</div>
        <p>You haven't saved any listings yet.</p>
        <a class="search-btn-link" href="index.html">Search for Parts</a>
      </div>

      <!-- Cards -->
      <div class="cards-grid" id="cardsGrid" style="display:none"></div>
    </div>
  </main>

  <footer>&copy; 2025 PartsFinder &nbsp;·&nbsp; Connecting buyers with wreckers across Australia</footer>

  <script src="../config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

    async function init() {
      const { data: { session } } = await db.auth.getSession();
      if (!session) { window.location.href = 'login.html'; return; }

      document.getElementById('userEmail').textContent = session.user.email;
      loadSaved(session.user.id);
    }

    async function loadSaved(userId) {
      const { data, error } = await db
        .from('saved_listings')
        .select('id, listing_id, inventory(*)')
        .eq('user_id', userId)
        .order('created_at', { ascending: false });

      document.getElementById('loadingState').style.display = 'none';

      if (error || !data || data.length === 0) {
        document.getElementById('emptyState').style.display = 'block';
        return;
      }

      const grid = document.getElementById('cardsGrid');
      grid.style.display = 'grid';

      data.forEach(row => {
        const inv = row.inventory;
        if (!inv) return;
        const card = document.createElement('div');
        card.className = 'listing-card';
        card.innerHTML = `
          <div class="card-part">${inv.part_type ?? '—'}</div>
          <div class="card-car">${inv.year ?? ''} ${inv.make ?? ''} ${inv.model ?? ''}</div>
          <div class="card-details">
            ${inv.colour ? `<div class="card-detail"><span>Colour</span>${inv.colour}</div>` : ''}
            <div class="card-detail"><span>Location</span>${inv.suburb ? inv.suburb + ', ' : ''}${inv.state ?? '—'}</div>
            <div class="card-detail"><span>Wrecker</span>${inv.wrecker_name ?? '—'}</div>
          </div>
          <div class="card-footer">
            <a class="contact-link" href="${formatContact(inv.contact)}">${inv.contact ?? '—'}</a>
            <button class="unsave-btn" title="Remove saved listing" onclick="unsave(${row.id}, this)">🗑️</button>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    async function unsave(savedId, btn) {
      btn.textContent = '⏳';
      const { error } = await db.from('saved_listings').delete().eq('id', savedId);
      if (!error) {
        btn.closest('.listing-card').remove();
        const grid = document.getElementById('cardsGrid');
        if (grid.children.length === 0) {
          grid.style.display = 'none';
          document.getElementById('emptyState').style.display = 'block';
        }
      }
    }

    async function logout() {
      await db.auth.signOut();
      window.location.href = 'home.html';
    }

    function formatContact(contact) {
      if (!contact) return '#';
      if (contact.includes('@')) return `mailto:${contact}`;
      if (/^\d/.test(contact.replace(/\s/g, ''))) return `tel:${contact.replace(/\s/g, '')}`;
      return '#';
    }

    init();
  </script>
</body>
</html>
